    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        /* White, matching the native win32 splash, so the hand-off
           native splash -> this loader -> app has no colour flash. */
        background: #ffffff;
      }

      /* Sits outside #app so it survives Vue mounting; App.vue removes it
         once startup is done. Covers the app until then. */
      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: var(--startup-bg, #ffffff);
        color: #1976d2;
        font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
        transition: opacity 0.15s ease-out;
      }

      #startup-loader.startup-loader-done {
        opacity: 0;
        pointer-events: none;
      }

      .startup-loader-status {
        position: absolute;
        left: calc(50% + var(--startup-logo-dx, 0px));
        top: calc(50% + var(--startup-logo-dy, -60px) + var(--startup-logo-size, 120px) / 2 + 28px);
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .startup-spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(25, 118, 210, 0.2);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite !important;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }

  <body>
    <div id="startup-loader" role="status" aria-label="Loading">
      <div class="startup-loader-logo" role="img" aria-label="GB Cloud"></div>
      <div class="startup-loader-status">
        <div class="startup-spinner" aria-hidden="true"></div>
        <span>Loading…</span>
      </div>
    </div>
    <script>
      // Where and how the login page last drew its logo; see
      // LoginForm.vue rememberLogoSpot. Absent on a first run.
      try {
        var spot = JSON.parse(localStorage.getItem("startupLogoSpot") || "null");
        if (spot) {
          var style = document.getElementById("startup-loader").style;
          style.setProperty("--startup-logo-dx", spot.dx + "px");
          style.setProperty("--startup-logo-dy", spot.dy + "px");
          style.setProperty("--startup-logo-size", spot.size + "px");
          if (spot.color) style.setProperty("--startup-logo-color", spot.color);
          if (spot.background) style.setProperty("--startup-bg", spot.background);
        }
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
