<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kashi Cloud</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      #startup-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1976d2;
        font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
      }

      .startup-loader-content {
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .startup-spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(25, 118, 210, 0.2);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite !important;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="startup-loader" role="status" aria-label="Loading">
        <div class="startup-loader-content">
          <div class="startup-spinner" aria-hidden="true"></div>
          <span>Loading…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
