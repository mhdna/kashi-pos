    <title>Kashi Cloud</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        /* Match the native window BackgroundColour (main.go) and the win32
           splash so there is no colour flash between hand-offs:
           native splash -> blank window -> this loader -> app. */
        background: #1b2636;
      }

      #startup-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1b2636;
        color: #e3f0ff;
        font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
      }

      .startup-loader-content {
        display: grid;
        justify-items: center;
        gap: 20px;
      }

      .startup-loader-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }

      .startup-spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(227, 240, 255, 0.25);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite !important;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
