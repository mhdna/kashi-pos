<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />

    <title>GB Cloud</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        /* White, matching the native win32 splash, so the hand-off
           native splash -> this loader -> app has no colour flash. */
        background: #ffffff;
      }

      #startup-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1976d2;
        font-family: "Roboto", "Helvetica Neue", Arial, sans-serif;
      }

      .startup-loader-content {
        display: grid;
        justify-items: center;
        gap: 20px;
      }

      .startup-loader-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }

      .startup-spinner {
        width: 36px;
        height: 36px;
        border: 4px solid rgba(25, 118, 210, 0.2);
        border-top-color: currentColor;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite !important;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
